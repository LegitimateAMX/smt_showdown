<!doctype html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SMT Showdown — Engine smoke tests</title>
    <style>
      :root { color-scheme: dark; font-family: ui-monospace, Consolas, monospace; }
      body { max-width: 780px; margin: 50px auto; padding: 0 20px; color: #eee; background: #090a0e; }
      h1 { font: 400 32px Georgia, serif; }
      p { color: #9b9eaa; line-height: 1.6; }
      ol { padding: 0; border: 1px solid #2b2e38; list-style: none; }
      li { padding: 12px 14px; border-bottom: 1px solid #2b2e38; font-size: 12px; }

      .fail { border-left: 3px solid #ff5d63; color: #ffb2b5; }
